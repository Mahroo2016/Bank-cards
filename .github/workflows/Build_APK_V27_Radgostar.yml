name: Build APK V27

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/radgostar/cardvault app/src/main/res/values app/src/main/res/drawable

          cat > settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='RadgostarCardVault'
          include ':app'
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins { id 'com.android.application' version '8.6.1' apply false }
          GRADLE

          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.radgostar.cardvault'
            compileSdk 35
            defaultConfig { applicationId 'com.radgostar.cardvault'; minSdk 23; targetSdk 35; versionCode 27; versionName '2.7' }
          }
          GRADLE

          cat > app/src/main/res/values/strings.xml <<'XML'
          <resources><string name="app_name">کارت‌های بانکی</string></resources>
          XML

          cat > app/src/main/res/values/styles.xml <<'XML'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:statusBarColor">#35145B</item><item name="android:navigationBarColor">#F7F4FA</item><item name="android:colorAccent">#6E3FB5</item></style></resources>
          XML

          cat > app/src/main/res/drawable/ic_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#35145B" android:pathData="M0,0h108v108h-108z"/><path android:fillColor="#FFFFFF" android:pathData="M16,31h76v48h-76z"/><path android:fillColor="#6E3FB5" android:pathData="M16,39h76v10h-76z"/><path android:fillColor="#F5C542" android:pathData="M73,58h12v12h-12z"/></vector>
          XML

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.USE_FINGERPRINT"/>
            <application android:theme="@style/AppTheme" android:label="@string/app_name" android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher" android:allowBackup="false" android:supportsRtl="true">
              <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
            </application>
          </manifest>
          XML

          cat > app/src/main/java/com/radgostar/cardvault/MainActivity.java <<'JAVA'
          package com.radgostar.cardvault;

          import android.app.*;import android.os.*;import android.content.*;import android.graphics.*;import android.graphics.drawable.GradientDrawable;import android.hardware.fingerprint.FingerprintManager;import android.security.keystore.*;import android.text.InputFilter;import android.text.InputType;import android.util.Base64;import android.view.*;import android.widget.*;import java.nio.charset.StandardCharsets;import java.security.KeyStore;import javax.crypto.*;import javax.crypto.spec.GCMParameterSpec;

          public class MainActivity extends Activity{
            static final String P="radgostar_cards",A="RadgostarAES"; android.content.SharedPreferences sp; LinearLayout list; boolean unlocked;
            int purple=Color.rgb(53,20,91), bg=Color.rgb(247,244,250);
            public void onCreate(Bundle b){super.onCreate(b);getWindow().setStatusBarColor(purple);getWindow().setNavigationBarColor(bg);sp=getSharedPreferences(P,0);key();if(!sp.getBoolean("pinSet",false))setup();else unlock();}
            void key(){try{KeyStore k=KeyStore.getInstance("AndroidKeyStore");k.load(null);if(!k.containsAlias(A)){KeyGenerator g=KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES,"AndroidKeyStore");g.init(new KeyGenParameterSpec.Builder(A,KeyProperties.PURPOSE_ENCRYPT|KeyProperties.PURPOSE_DECRYPT).setBlockModes(KeyProperties.BLOCK_MODE_GCM).setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE).build());g.generateKey();}}catch(Exception e){}}
            String enc(String s){try{KeyStore k=KeyStore.getInstance("AndroidKeyStore");k.load(null);SecretKey q=(SecretKey)k.getKey(A,null);Cipher c=Cipher.getInstance("AES/GCM/NoPadding");c.init(Cipher.ENCRYPT_MODE,q);return Base64.encodeToString(c.getIV(),0)+":"+Base64.encodeToString(c.doFinal(s.getBytes(StandardCharsets.UTF_8)),0);}catch(Exception e){return "";}}
            String dec(String s){try{String[]x=s.split(":");KeyStore k=KeyStore.getInstance("AndroidKeyStore");k.load(null);SecretKey q=(SecretKey)k.getKey(A,null);Cipher c=Cipher.getInstance("AES/GCM/NoPadding");c.init(Cipher.DECRYPT_MODE,q,new GCMParameterSpec(128,Base64.decode(x[0],0)));return new String(c.doFinal(Base64.decode(x[1],0)),StandardCharsets.UTF_8);}catch(Exception e){return "";}}
            TextView t(String s,float z){TextView v=new TextView(this);v.setText(s);v.setTextSize(z);v.setTextColor(Color.rgb(45,35,55));v.setPadding(10,8,10,8);return v;}
            Button b(String s){Button x=new Button(this);x.setText(s);x.setTextSize(14);x.setAllCaps(false);return x;}
            EditText e(String h){EditText x=new EditText(this);x.setHint(h);x.setPadding(12,4,12,4);return x;}
            EditText pin(){EditText x=e("PIN");x.setGravity(Gravity.CENTER);x.setInputType(2|16);x.setFilters(new InputFilter[]{new InputFilter.LengthFilter(6)});return x;}
            LinearLayout.LayoutParams w(){return new LinearLayout.LayoutParams(0,-2,1);}
            GradientDrawable gd(int c,int r){GradientDrawable g=new GradientDrawable();g.setColor(c);g.setCornerRadius(r);return g;}
            void setup(){LinearLayout l=new LinearLayout(this);l.setOrientation(LinearLayout.VERTICAL);l.setGravity(Gravity.CENTER);l.setPadding(30,35,30,35);l.setBackgroundColor(bg);TextView h=t("🔐 راه‌اندازی کارت‌های بانکی",25);h.setGravity(17);h.setTypeface(null,1);l.addView(h);TextView q=t("قبل از ورود، PIN چهار تا شش رقمی تعریف کنید.",16);q.setGravity(17);l.addView(q);EditText a=pin(),c=pin();a.setHint("PIN جدید");c.setHint("تکرار PIN");l.addView(a);l.addView(c);Button ok=b("🔒 ثبت PIN و ورود");l.addView(ok);ok.setOnClickListener(v->{String x=a.getText().toString();if(!x.matches("\\d{4,6}")){toast("PIN باید ۴ تا ۶ رقم باشد");return;}if(!x.equals(c.getText().toString())){toast("PINها یکسان نیستند");return;}sp.edit().putBoolean("pinSet",true).putString("pin",enc(x)).apply();unlocked=true;home();});setContentView(l);}
            void unlock(){LinearLayout l=new LinearLayout(this);l.setOrientation(LinearLayout.VERTICAL);l.setGravity(Gravity.CENTER);l.setPadding(30,35,30,35);l.setBackgroundColor(bg);TextView h=t("🔐 کارت‌های بانکی",28);h.setGravity(17);h.setTypeface(null,1);l.addView(h);TextView q=t("برای ورود PIN را وارد کنید یا اثر انگشت را بزنید.",16);q.setGravity(17);l.addView(q);EditText p=pin();l.addView(p);Button in=b("🔓 ورود"),fp=b("👆 ورود با اثر انگشت");l.addView(in);l.addView(fp);in.setOnClickListener(v->{if(dec(sp.getString("pin","" )).equals(p.getText().toString())){unlocked=true;home();}else toast("PIN اشتباه است");});fp.setOnClickListener(v->fingerprint());setContentView(l);}
            void fingerprint(){if(Build.VERSION.SDK_INT<23){toast("اثر انگشت پشتیبانی نمی‌شود");return;}FingerprintManager f=(FingerprintManager)getSystemService(FINGERPRINT_SERVICE);if(f==null||!f.isHardwareDetected()||!f.hasEnrolledFingerprints()){toast("اثر انگشت در گوشی فعال نیست؛ از PIN استفاده کنید");return;}CancellationSignal s=new CancellationSignal();new AlertDialog.Builder(this).setTitle("👆 اثر انگشت").setMessage("انگشت خود را روی حسگر قرار دهید").setNegativeButton("لغو",(d,w)->s.cancel()).show();f.authenticate(null,s,getMainExecutor(),new FingerprintManager.AuthenticationCallback(){public void onAuthenticationSucceeded(FingerprintManager.AuthenticationResult r){runOnUiThread(()->{unlocked=true;home();});}public void onAuthenticationFailed(){runOnUiThread(()->toast("اثر انگشت تأیید نشد"));}});}
            void home(){if(!unlocked){unlock();return;}LinearLayout root=new LinearLayout(this);root.setOrientation(LinearLayout.VERTICAL);root.setBackgroundColor(bg);LinearLayout head=new LinearLayout(this);head.setOrientation(LinearLayout.VERTICAL);head.setGravity(17);head.setPadding(12,18,12,16);head.setBackgroundColor(purple);TextView h=t("کارت‌های بانکی 💳",28);h.setTextColor(Color.WHITE);h.setTypeface(null,1);h.setGravity(17);head.addView(h);TextView q=t("کیف امن اطلاعات کارت",16);q.setTextColor(Color.WHITE);q.setGravity(17);head.addView(q);root.addView(head);LinearLayout top=new LinearLayout(this);top.setPadding(10,12,10,4);Button add=b("＋ افزودن کارت"),lock=b("🔒 قفل برنامه");top.addView(add,w());Space gap=new Space(this);top.addView(gap,new LinearLayout.LayoutParams(18,1));top.addView(lock,w());root.addView(top);add.setOnClickListener(v->edit(-1));lock.setOnClickListener(v->{unlocked=false;unlock();});ScrollView s=new ScrollView(this);list=new LinearLayout(this);list.setOrientation(LinearLayout.VERTICAL);list.setPadding(10,5,10,18);s.addView(list);root.addView(s,new LinearLayout.LayoutParams(-1,0,1));Button about=b("ℹ️ درباره ما");LinearLayout bottom=new LinearLayout(this);bottom.setPadding(10,4,10,8);bottom.addView(about,w());root.addView(bottom);about.setOnClickListener(v->about());setContentView(root);refresh();}
            String val(String k,int i){return dec(sp.getString(k+i,""));}
            String mask(String n){return n.length()==16?n.substring(0,4)+"  ****  ****  "+n.substring(12):n;}
            void refresh(){list.removeAllViews();int n=sp.getInt("count",0);if(n==0){TextView x=t("هنوز کارتی ثبت نشده است.\nاز «افزودن کارت» شروع کنید.",18);x.setGravity(17);list.addView(x);return;}for(int i=0;i<n;i++)card(i);}
            void card(int i){LinearLayout c=new LinearLayout(this);c.setOrientation(LinearLayout.VERTICAL);c.setPadding(16,14,16,14);c.setBackground(gd(Color.WHITE,28));TextView bank=t("🏦 "+val("bank",i)+"   🟢 امن",19);bank.setTypeface(null,1);c.addView(bank);TextView num=t(mask(val("card",i)),24);num.setGravity(17);num.setTypeface(null,1);c.addView(num);TextView meta=t("انقضا: "+val("em",i)+" / "+val("ey",i)+"   •   CVV2: ••••",15);meta.setGravity(17);c.addView(meta);LinearLayout a=new LinearLayout(this);Button edit=b("✏️ ویرایش"),info=b("👁️ مشاهده اطلاعات"),cv=b("🔐 مشاهده CVV2");a.addView(edit,w());a.addView(info,w());a.addView(cv,w());c.addView(a);Button share=b("📤 اشتراک شماره کارت و نام و بانک");c.addView(share);Button del=b("🗑️ حذف کارت");del.setTextColor(Color.rgb(170,45,55));c.addView(del);edit.setOnClickListener(v->edit(i));info.setOnClickListener(v->protectedInfo(i));cv.setOnClickListener(v->cvv(i));share.setOnClickListener(v->share(i));del.setOnClickListener(v->del(i));LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(-1,-2);p.setMargins(0,8,0,12);list.addView(c,p);}
            void edit(int i){LinearLayout l=new LinearLayout(this);l.setOrientation(LinearLayout.VERTICAL);EditText bank=e("نام بانک"),name=e("نام صاحب کارت"),card=e("شماره کارت — دقیقاً ۱۶ رقم"),sh=e("شماره شبا — اختیاری"),mm=e("ماه انقضا — ۲ رقم"),yy=e("سال انقضا — ۲ رقم"),cv=e("CVV2 — ۳ یا ۴ رقم");card.setInputType(2);card.setFilters(new InputFilter[]{new InputFilter.LengthFilter(16)});mm.setInputType(2);mm.setFilters(new InputFilter[]{new InputFilter.LengthFilter(2)});yy.setInputType(2);yy.setFilters(new InputFilter[]{new InputFilter.LengthFilter(2)});cv.setInputType(2|16);cv.setFilters(new InputFilter[]{new InputFilter.LengthFilter(4)});l.addView(bank);l.addView(name);l.addView(card);l.addView(sh);l.addView(mm);l.addView(yy);l.addView(cv);if(i>=0){bank.setText(val("bank",i));name.setText(val("name",i));card.setText(val("card",i));sh.setText(val("shaba",i));mm.setText(val("em",i));yy.setText(val("ey",i));cv.setText(val("cvv",i));}AlertDialog d=new AlertDialog.Builder(this).setTitle(i<0?"افزودن کارت":"ویرایش کارت").setView(l).setNegativeButton("لغو",null).setPositiveButton("ذخیره",null).create();d.setOnShowListener(x->d.getButton(-1).setOnClickListener(v->{String n=card.getText().toString().trim(),m=mm.getText().toString().trim(),y=yy.getText().toString().trim(),z=cv.getText().toString().trim();if(!n.matches("\\d{16}")){toast("شماره کارت باید دقیقاً ۱۶ رقم و بدون فاصله باشد");return;}if(!m.matches("\\d{2}")||Integer.parseInt(m)<1||Integer.parseInt(m)>12){toast("ماه باید دو رقم بین 01 تا 12 باشد");return;}if(!y.matches("\\d{2}")){toast("سال باید دقیقاً دو رقم باشد");return;}if(!z.matches("\\d{3,4}")){toast("CVV2 باید ۳ یا ۴ رقم باشد");return;}int p=i;if(p<0){p=sp.getInt("count",0);sp.edit().putInt("count",p+1).apply();}sp.edit().putString("bank"+p,enc(bank.getText().toString().trim())).putString("name"+p,enc(name.getText().toString().trim())).putString("card"+p,enc(n)).putString("shaba"+p,enc(sh.getText().toString().trim())).putString("em"+p,enc(m)).putString("ey"+p,enc(y)).putString("cvv"+p,enc(z)).apply();d.dismiss();refresh();toast("کارت ذخیره شد");}));d.show();}
            void askPin(int i,String title,boolean cv){EditText p=pin();new AlertDialog.Builder(this).setTitle(title).setMessage("برای نمایش اطلاعات حساس PIN را وارد کنید.").setView(p).setNegativeButton("لغو",null).setPositiveButton("نمایش",(d,w)->{if(!dec(sp.getString("pin","" )).equals(p.getText().toString())){toast("PIN اشتباه است");return;}if(cv)new AlertDialog.Builder(this).setTitle("CVV2").setMessage(val("cvv",i)).setPositiveButton("باشه",null).show();else{String s="بانک: "+val("bank",i)+"\nنام: "+val("name",i)+"\nشماره کارت: "+val("card",i)+"\nشبا: "+val("shaba",i)+"\nانقضا: "+val("em",i)+"/"+val("ey",i);new AlertDialog.Builder(this).setTitle("اطلاعات کارت").setMessage(s).setPositiveButton("باشه",null).show();}}).show();}
            void protectedInfo(int i){askPin(i,"🔐 مشاهده اطلاعات کارت",false);}void cvv(int i){askPin(i,"🔐 مشاهده CVV2",true);}
            void share(int i){String s="بانک: "+val("bank",i)+"\nنام: "+val("name",i)+"\nشماره کارت: "+val("card",i);Intent x=new Intent(Intent.ACTION_SEND);x.setType("text/plain");x.putExtra(Intent.EXTRA_TEXT,s);startActivity(Intent.createChooser(x,"اشتراک‌گذاری کارت"));}
            void del(int i){new AlertDialog.Builder(this).setTitle("حذف کارت").setMessage("این کارت حذف شود؟").setNegativeButton("لغو",null).setPositiveButton("حذف",(d,w)->{int n=sp.getInt("count",0);for(int j=i;j<n-1;j++){String[]ks={"bank","name","card","shaba","em","ey","cvv"};for(String k:ks)sp.edit().putString(k+j,sp.getString(k+(j+1),"")).apply();}sp.edit().putInt("count",n-1).apply();refresh();}).show();}
            void about(){new AlertDialog.Builder(this).setTitle("درباره ما — رادگستر").setMessage("کارت‌های بانکی رادگستر یک کیف امن برای نگهداری اطلاعات کارت است.\n\nامکانات:\n• ذخیره شماره کارت و شبا\n• نام بانک و صاحب کارت\n• تاریخ انقضا به صورت ماه و سال\n• CVV2 با محافظت PIN\n• رمزنگاری اطلاعات حساس\n• ورود با PIN و اثر انگشت در دستگاه‌های پشتیبانی‌شده\n• مشاهده کنترل‌شده اطلاعات کارت\n• اشتراک شماره کارت، نام و بانک\n\nتیم سازنده: رادگستر\nنسخه 2.7").setPositiveButton("باشه",null).show();}
            void toast(String s){Toast.makeText(this,s,Toast.LENGTH_SHORT).show();}
          }
          JAVA

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Radgostar-CardVault-APK-V27
          path: app/build/outputs/apk/debug/app-debug.apk
