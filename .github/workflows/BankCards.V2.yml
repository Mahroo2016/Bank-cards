name: Build Bank Cards APK V2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/example/bankcards
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BankCards"
          include(":app")
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          GRADLE

          cat > gradle.properties <<'PROPS'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          PROPS

          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.bankcards'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.bankcards'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName "2.0"
              }
          }

          dependencies {
              implementation 'androidx.core:core:1.13.1'
              implementation 'androidx.biometric:biometric:1.1.0'
          }
          GRADLE

          cat > app/src/main/res/values/strings.xml <<'XML'
          <resources>
              <string name="app_name">کیف کارت</string>
          </resources>
          XML

          cat > app/src/main/res/values/styles.xml <<'XML'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#F7F8FC</item>
                  <item name="android:navigationBarColor">#F7F8FC</item>
                  <item name="android:colorAccent">#3157D5</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          XML

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
              <uses-permission android:name="android.permission.USE_FINGERPRINT"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:allowBackup="false"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="false"/>

                  <activity
                      android:name=".PinActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > app/src/main/java/com/example/bankcards/PinActivity.java <<'JAVA'
          package com.example.bankcards;

          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.graphics.*;
          import android.graphics.drawable.GradientDrawable;
          import android.view.*;
          import android.widget.*;
          import androidx.biometric.BiometricManager;
          import androidx.biometric.BiometricPrompt;
          import androidx.core.content.ContextCompat;
          import androidx.fragment.app.FragmentActivity;
          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;
          import android.util.Base64;

          public class PinActivity extends FragmentActivity {
              private SharedPreferences prefs;
              private EditText pin;
              private boolean setupMode;

              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(Color.rgb(247,248,252));
                  getWindow().setNavigationBarColor(Color.rgb(247,248,252));
                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR);

                  prefs = getSharedPreferences("cards", MODE_PRIVATE);
                  setupMode = !prefs.getBoolean("security_setup", false);

                  if (setupMode) showSetup();
                  else showLogin();
              }

              private GradientDrawable rounded(int color, float radius) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(radius);
                  return g;
              }

              private TextView tv(String s, float z) {
                  TextView v = new TextView(this);
                  v.setText(s);
                  v.setTextSize(z);
                  v.setTextColor(Color.rgb(30,34,45));
                  v.setPadding(8,8,8,8);
                  return v;
              }

              private Button action(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setTextSize(15);
                  b.setTextColor(Color.WHITE);
                  b.setAllCaps(false);
                  b.setBackground(rounded(Color.rgb(49,87,213), 28));
                  return b;
              }

              private void showSetup() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setPadding(32, 45, 32, 32);
                  root.setBackgroundColor(Color.rgb(247,248,252));

                  TextView icon = tv("🔐", 52);
                  icon.setGravity(Gravity.CENTER);
                  root.addView(icon);

                  TextView title = tv("راه‌اندازی امنیت برنامه", 26);
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  TextView desc = tv("قبل از ورود به برنامه باید PIN تعیین شود. اگر اثر انگشت روی گوشی فعال باشد، ورود با اثر انگشت نیز فعال می‌شود.", 15);
                  desc.setGravity(Gravity.CENTER);
                  root.addView(desc);

                  EditText p1 = new EditText(this);
                  p1.setHint("PIN جدید، حداقل ۴ رقم");
                  p1.setInputType(2 | 16);
                  p1.setGravity(Gravity.CENTER);
                  root.addView(p1, new LinearLayout.LayoutParams(-1, -2));

                  EditText p2 = new EditText(this);
                  p2.setHint("تکرار PIN");
                  p2.setInputType(2 | 16);
                  p2.setGravity(Gravity.CENTER);
                  root.addView(p2, new LinearLayout.LayoutParams(-1, -2));

                  TextView biometricStatus = tv(biometricStatusText(), 14);
                  biometricStatus.setGravity(Gravity.CENTER);
                  root.addView(biometricStatus);

                  Button save = action("ذخیره PIN و ادامه");
                  LinearLayout.LayoutParams sp = new LinearLayout.LayoutParams(-1, 58);
                  sp.setMargins(0, 20, 0, 8);
                  root.addView(save, sp);

                  setContentView(root);

                  save.setOnClickListener(v -> {
                      String a = p1.getText().toString().trim();
                      String b = p2.getText().toString().trim();

                      if (a.length() < 4) {
                          p1.setError("PIN باید حداقل ۴ رقم باشد");
                          return;
                      }
                      if (!a.equals(b)) {
                          p2.setError("PINها یکسان نیستند");
                          return;
                      }

                      prefs.edit()
                          .putString("pin_hash", hash(a))
                          .putBoolean("security_setup", true)
                          .apply();

                      Toast.makeText(this, "امنیت برنامه فعال شد", Toast.LENGTH_SHORT).show();
                      showLogin();
                  });
              }

              private String biometricStatusText() {
                  BiometricManager bm = BiometricManager.from(this);
                  int r = bm.canAuthenticate(
                      BiometricManager.Authenticators.BIOMETRIC_STRONG |
                      BiometricManager.Authenticators.BIOMETRIC_WEAK
                  );

                  if (r == BiometricManager.BIOMETRIC_SUCCESS)
                      return "✓ اثر انگشت/احراز هویت زیستی آماده است.";
                  if (r == BiometricManager.BIOMETRIC_ERROR_NONE_ENROLLED)
                      return "ℹ️ اثر انگشت هنوز روی گوشی ثبت نشده؛ بعداً از تنظیمات گوشی ثبتش کنید.";
                  return "ℹ️ ورود با PIN همیشه در دسترس است.";
              }

              private void showLogin() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setPadding(32, 55, 32, 32);
                  root.setBackgroundColor(Color.rgb(247,248,252));

                  TextView icon = tv("💳", 58);
                  icon.setGravity(Gravity.CENTER);
                  root.addView(icon);

                  TextView title = tv("کیف کارت", 30);
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  TextView sub = tv("برای ورود، PIN یا اثر انگشت را تأیید کنید", 15);
                  sub.setGravity(Gravity.CENTER);
                  root.addView(sub);

                  pin = new EditText(this);
                  pin.setHint("PIN");
                  pin.setInputType(2 | 16);
                  pin.setGravity(Gravity.CENTER);
                  root.addView(pin, new LinearLayout.LayoutParams(-1, -2));

                  Button enter = action("ورود با PIN");
                  LinearLayout.LayoutParams ep = new LinearLayout.LayoutParams(-1, 58);
                  ep.setMargins(0, 15, 0, 8);
                  root.addView(enter, ep);
                  enter.setOnClickListener(v -> checkPin());

                  BiometricManager bm = BiometricManager.from(this);
                  int br = bm.canAuthenticate(
                      BiometricManager.Authenticators.BIOMETRIC_STRONG |
                      BiometricManager.Authenticators.BIOMETRIC_WEAK
                  );

                  if (br == BiometricManager.BIOMETRIC_SUCCESS) {
                      Button bio = action("👆 ورود با اثر انگشت");
                      root.addView(bio, new LinearLayout.LayoutParams(-1, 58));
                      bio.setOnClickListener(v -> authenticate());
                  }

                  setContentView(root);
              }

              private void checkPin() {
                  if (prefs.getString("pin_hash","").equals(hash(pin.getText().toString()))) {
                      openMain();
                  } else {
                      pin.setError("PIN اشتباه است");
                  }
              }

              private void authenticate() {
                  Executor executor = ContextCompat.getMainExecutor(this);
                  BiometricPrompt prompt = new BiometricPrompt(this, executor,
                      new BiometricPrompt.AuthenticationCallback() {
                          @Override public void onAuthenticationSucceeded(
                              BiometricPrompt.AuthenticationResult result) {
                              runOnUiThread(() -> openMain());
                          }

                          @Override public void onAuthenticationError(int code, CharSequence msg) {
                              runOnUiThread(() ->
                                  Toast.makeText(PinActivity.this, msg, Toast.LENGTH_SHORT).show());
                          }
                      });

                  BiometricPrompt.PromptInfo info = new BiometricPrompt.PromptInfo.Builder()
                      .setTitle("ورود به کیف کارت")
                      .setSubtitle("اثر انگشت خود را تأیید کنید")
                      .setNegativeButtonText("ورود با PIN")
                      .build();

                  prompt.authenticate(info);
              }

              private void openMain() {
                  startActivity(new Intent(this, MainActivity.class));
                  finish();
              }

              private String hash(String s) {
                  try {
                      MessageDigest md = MessageDigest.getInstance("SHA-256");
                      return Base64.encodeToString(
                          md.digest(s.getBytes(StandardCharsets.UTF_8)),
                          Base64.NO_WRAP
                      );
                  } catch (Exception e) {
                      return s;
                  }
              }
          }
          JAVA

          cat > app/src/main/java/com/example/bankcards/MainActivity.java <<'JAVA'
          package com.example.bankcards;

          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.graphics.*;
          import android.graphics.drawable.GradientDrawable;
          import android.text.InputFilter;
          import android.text.method.PasswordTransformationMethod;
          import android.view.*;
          import android.widget.*;
          import java.util.*;
          import org.json.*;

          public class MainActivity extends Activity {
              private SharedPreferences prefs;
              private JSONArray cards;
              private LinearLayout list;

              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(Color.rgb(247,248,252));
                  getWindow().setNavigationBarColor(Color.rgb(247,248,252));
                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR);
                  prefs = getSharedPreferences("cards", MODE_PRIVATE);
                  load();
                  showCards();
              }

              @Override protected void onResume() {
                  super.onResume();
              }

              private void load() {
                  try { cards = new JSONArray(prefs.getString("data","[]")); }
                  catch(Exception e) { cards = new JSONArray(); }
              }

              private void save() {
                  prefs.edit().putString("data", cards.toString()).apply();
              }

              private GradientDrawable rounded(int color, float radius) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(radius);
                  return g;
              }

              private TextView tv(String s, float z) {
                  TextView v = new TextView(this);
                  v.setText(s);
                  v.setTextSize(z);
                  v.setTextColor(Color.rgb(30,34,45));
                  v.setPadding(14,8,14,8);
                  return v;
              }

              private Button action(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setTextSize(15);
                  b.setTextColor(Color.WHITE);
                  b.setAllCaps(false);
                  b.setBackground(rounded(Color.rgb(49,87,213), 28));
                  return b;
              }

              private EditText field(String hint) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setTextSize(15);
                  e.setSingleLine(true);
                  e.setPadding(18,4,18,4);
                  e.setBackground(rounded(Color.rgb(245,246,250), 20));
                  return e;
              }

              private void showCards() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(18, 18, 18, 18);
                  root.setBackgroundColor(Color.rgb(247,248,252));

                  Space top = new Space(this);
                  root.addView(top, new LinearLayout.LayoutParams(1, 18));

                  TextView title = tv("💳  کیف کارت", 28);
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  TextView sub = tv("کارت‌های بانکی شما", 14);
                  sub.setGravity(Gravity.CENTER);
                  root.addView(sub);

                  Button add = action("＋  افزودن کارت جدید");
                  LinearLayout.LayoutParams ap = new LinearLayout.LayoutParams(-1, 58);
                  ap.setMargins(0, 18, 0, 12);
                  root.addView(add, ap);
                  add.setOnClickListener(v -> edit(-1));

                  ScrollView sc = new ScrollView(this);
                  list = new LinearLayout(this);
                  list.setOrientation(LinearLayout.VERTICAL);
                  sc.addView(list);
                  root.addView(sc, new LinearLayout.LayoutParams(-1,0,1));

                  Button lock = action("🔒  قفل برنامه");
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, 54);
                  lp.setMargins(0, 12, 0, 0);
                  root.addView(lock, lp);
                  lock.setOnClickListener(v -> {
                      startActivity(new Intent(this, PinActivity.class));
                      finish();
                  });

                  setContentView(root);
                  refresh();
              }

              private void refresh() {
                  list.removeAllViews();

                  if(cards.length()==0) {
                      TextView empty=tv("هنوز کارتی ثبت نشده است.\nاز دکمه بالا کارت اول را اضافه کنید.",16);
                      empty.setGravity(Gravity.CENTER);
                      list.addView(empty);
                      return;
                  }

                  for(int i=0;i<cards.length();i++) {
                      final int ix=i;
                      try {
                          JSONObject c=cards.getJSONObject(i);
                          LinearLayout card=new LinearLayout(this);
                          card.setOrientation(LinearLayout.VERTICAL);
                          card.setPadding(22,20,22,20);
                          card.setBackground(rounded(Color.WHITE,30));
                          card.setElevation(6);

                          TextView bank=tv("🏦  "+c.optString("bank","بانک"),21);
                          bank.setTypeface(Typeface.DEFAULT,Typeface.BOLD);
                          card.addView(bank);

                          TextView num=tv(mask(c.optString("number","")),20);
                          num.setTypeface(Typeface.MONOSPACE,Typeface.BOLD);
                          card.addView(num);

                          card.addView(tv("شبا: "+maskShaba(c.optString("shaba","")),14));
                          card.addView(tv("انقضا: "+c.optString("month","--")+"/"+c.optString("year","----"),14));
                          card.addView(tv("صاحب کارت: "+c.optString("name","-"),14));

                          LinearLayout buttons=new LinearLayout(this);
                          Button edit=action("✏️  ویرایش");
                          Button del=action("🗑  حذف");
                          buttons.addView(edit,new LinearLayout.LayoutParams(0,54,1));
                          LinearLayout.LayoutParams dp=new LinearLayout.LayoutParams(0,54,1);
                          dp.setMargins(8,0,0,0);
                          buttons.addView(del,dp);
                          card.addView(buttons);

                          edit.setOnClickListener(v->edit(ix));
                          del.setOnClickListener(v->deleteCard(ix));

                          LinearLayout.LayoutParams cp=new LinearLayout.LayoutParams(-1,-2);
                          cp.setMargins(0,8,0,8);
                          list.addView(card,cp);
                      }catch(Exception ignored){}
                  }
              }

              private String mask(String s) {
                  if(s.length()!=16) return "•••• •••• •••• ••••";
                  return s.substring(0,4)+"  ••••  ••••  "+s.substring(12);
              }

              private String maskShaba(String s) {
                  if(s.length()<10) return "••••••••••";
                  return s.substring(0,4)+"••••••••"+s.substring(s.length()-6);
              }

              private void deleteCard(int ix) {
                  new AlertDialog.Builder(this)
                      .setTitle("حذف کارت")
                      .setMessage("این کارت حذف شود؟")
                      .setNegativeButton("لغو",null)
                      .setPositiveButton("حذف",(d,w)->{
                          JSONArray n=new JSONArray();
                          for(int i=0;i<cards.length();i++) if(i!=ix) try{n.put(cards.get(i));}catch(Exception ignored){}
                          cards=n; save(); refresh();
                      }).show();
              }

              private void edit(int ix) {
                  boolean editing=ix>=0;
                  JSONObject old=new JSONObject();
                  try{if(editing)old=cards.getJSONObject(ix);}catch(Exception ignored){}

                  LinearLayout box=new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(22,8,22,8);

                  EditText bank=field("نام بانک");
                  EditText name=field("نام صاحب کارت");
                  EditText number=field("شماره کارت — دقیقاً ۱۶ رقم، بدون فاصله");
                  EditText shaba=field("شماره شبا");
                  EditText month=field("ماه انقضا — ۰۱ تا ۱۲");
                  EditText year=field("سال انقضا — ۴ رقم");

                  number.setInputType(2);
                  number.setFilters(new InputFilter[]{new InputFilter.LengthFilter(16)});
                  number.setTypeface(Typeface.MONOSPACE);
                  month.setInputType(2);
                  month.setFilters(new InputFilter[]{new InputFilter.LengthFilter(2)});
                  year.setInputType(2);
                  year.setFilters(new InputFilter[]{new InputFilter.LengthFilter(4)});

                  bank.setText(old.optString("bank",""));
                  name.setText(old.optString("name",""));
                  number.setText(old.optString("number",""));
                  shaba.setText(old.optString("shaba",""));
                  month.setText(old.optString("month",""));
                  year.setText(old.optString("year",""));

                  box.addView(bank);box.addView(name);box.addView(number);box.addView(shaba);box.addView(month);box.addView(year);

                  TextView warning=tv("⚠️ CVV2 در این برنامه ذخیره نمی‌شود. برای امنیت کارت، اطلاعات احراز هویت حساس را نگهداری نمی‌کنیم.",13);
                  warning.setTextColor(Color.rgb(150,70,20));
                  box.addView(warning);

                  AlertDialog d=new AlertDialog.Builder(this)
                      .setTitle(editing?"ویرایش کارت":"افزودن کارت")
                      .setView(box)
                      .setNegativeButton("لغو",null)
                      .setPositiveButton("ذخیره",null).create();

                  d.setOnShowListener(x->d.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(v->{
                      String n=number.getText().toString().trim();
                      String m=month.getText().toString().trim();
                      String y=year.getText().toString().trim();

                      if(!n.matches("[0-9]{16}")){
                          number.setError("شماره کارت باید دقیقاً ۱۶ رقم و بدون فاصله باشد");
                          return;
                      }
                      if(!m.matches("(0[1-9]|1[0-2])")){
                          month.setError("ماه باید بین 01 تا 12 باشد");
                          return;
                      }
                      if(!y.matches("[0-9]{4}")){
                          year.setError("سال باید ۴ رقم باشد");
                          return;
                      }

                      try{
                          JSONObject c=new JSONObject();
                          c.put("bank",bank.getText().toString().trim());
                          c.put("name",name.getText().toString().trim());
                          c.put("number",n);
                          c.put("shaba",shaba.getText().toString().trim());
                          c.put("month",m);
                          c.put("year",y);

                          if(editing)cards.put(ix,c); else cards.put(c);
                          save();
                          refresh();
                          d.dismiss();
                      }catch(Exception ignored){}
                  }));

                  d.show();
              }
          }
          JAVA

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BankCards-APK-V2
          path: app/build/outputs/apk/debug/app-debug.apk
