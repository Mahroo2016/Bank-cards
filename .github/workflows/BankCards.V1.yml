name: Build Bank Cards APK V1
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/example/bankcards
          mkdir -p app/src/main/res/values
          cat > settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name="BankCards"
          include(":app")
          GRADLE
          cat > build.gradle <<'GRADLE'
          plugins { id 'com.android.application' version '8.6.1' apply false }
          GRADLE
          cat > gradle.properties <<'PROPS'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          PROPS
          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.bankcards'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.example.bankcards'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies { implementation 'androidx.core:core:1.13.1' }
          GRADLE
          cat > app/src/main/res/values/strings.xml <<'XML'
          <resources><string name="app_name">کارت‌های بانکی</string></resources>
          XML
          cat > app/src/main/res/values/styles.xml <<'XML'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:colorAccent">#6750A4</item>
              </style>
          </resources>
          XML
          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
              <uses-permission android:name="android.permission.USE_FINGERPRINT"/>
              <application android:theme="@style/AppTheme" android:label="@string/app_name"
                  android:allowBackup="false" android:supportsRtl="true" android:usesCleartextTraffic="false">
                  <activity android:name=".PinActivity" android:screenOrientation="portrait" android:exported="false"/>
                  <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML
          cat > app/src/main/java/com/example/bankcards/MainActivity.java <<'JAVA'
          package com.example.bankcards;
          import android.app.*; import android.os.*; import android.content.*; import android.graphics.*;
          import android.graphics.drawable.GradientDrawable; import android.view.*; import android.widget.*;
          import java.util.*; import org.json.*;
          public class MainActivity extends Activity {
              SharedPreferences prefs; JSONArray cards; LinearLayout list;
              public void onCreate(Bundle b){super.onCreate(b); prefs=getSharedPreferences("cards",0); load(); showCards();}
              void load(){try{cards=new JSONArray(prefs.getString("data","[]"));}catch(Exception e){cards=new JSONArray();}}
              void save(){prefs.edit().putString("data",cards.toString()).apply();}
              TextView tv(String s,float z){TextView v=new TextView(this);v.setText(s);v.setTextSize(z);v.setPadding(14,10,14,10);return v;}
              Button bt(String s){Button b=new Button(this);b.setText(s);return b;}
              void showCards(){
                  LinearLayout r=new LinearLayout(this);r.setOrientation(LinearLayout.VERTICAL);r.setPadding(16,12,16,12);
                  TextView t=tv("💳 کارت‌های بانکی",25);t.setGravity(17);t.setTypeface(null,Typeface.BOLD);r.addView(t);
                  Button add=bt("➕ افزودن کارت جدید");r.addView(add);add.setOnClickListener(v->edit(-1));
                  ScrollView sc=new ScrollView(this);list=new LinearLayout(this);list.setOrientation(LinearLayout.VERTICAL);sc.addView(list);
                  r.addView(sc,new LinearLayout.LayoutParams(-1,0,1));
                  Button lock=bt("🔒 قفل برنامه");r.addView(lock);lock.setOnClickListener(v->{startActivity(new Intent(this,PinActivity.class));finish();});
                  setContentView(r); refresh();
              }
              String mask(String s){if(s.length()<8)return "•••• ••••";return s.substring(0,4)+" **** **** "+s.substring(s.length()-4);}
              String maskShaba(String s){if(s.length()<10)return "••••••••";return s.substring(0,4)+"••••••••"+s.substring(s.length()-6);}
              void refresh(){
                  list.removeAllViews(); if(cards.length()==0){TextView e=tv("هنوز کارتی ثبت نشده است.",17);e.setGravity(17);list.addView(e);return;}
                  for(int i=0;i<cards.length();i++)try{
                      final int ix=i;JSONObject c=cards.getJSONObject(i);
                      LinearLayout card=new LinearLayout(this);card.setOrientation(LinearLayout.VERTICAL);card.setPadding(20,16,20,16);
                      GradientDrawable g=new GradientDrawable();g.setColor(Color.rgb(245,245,250));g.setCornerRadius(28);card.setBackground(g);
                      TextView bank=tv("🏦 "+c.optString("bank","بانک"),20);bank.setTypeface(null,Typeface.BOLD);
                      card.addView(bank);card.addView(tv(mask(c.optString("number","")),18));
                      card.addView(tv("شبا: "+maskShaba(c.optString("shaba","")),15));
                      card.addView(tv("انقضا: "+c.optString("expiry","-"),15));
                      card.addView(tv("صاحب کارت: "+c.optString("name","-"),15));
                      Button e=bt("✏️ ویرایش");card.addView(e);e.setOnClickListener(v->edit(ix));
                      LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(-1,-2);p.setMargins(0,10,0,10);list.addView(card,p);
                  }catch(Exception ignored){}
              }
              void edit(int ix){
                  JSONObject old=new JSONObject();boolean editing=ix>=0;try{if(editing)old=cards.getJSONObject(ix);}catch(Exception ignored){}
                  LinearLayout box=new LinearLayout(this);box.setOrientation(LinearLayout.VERTICAL);box.setPadding(20,0,20,0);
                  EditText bank=new EditText(this);bank.setHint("نام بانک");bank.setText(old.optString("bank",""));
                  EditText name=new EditText(this);name.setHint("نام صاحب کارت");name.setText(old.optString("name",""));
                  EditText number=new EditText(this);number.setHint("شماره کارت");number.setInputType(2);number.setText(old.optString("number",""));
                  EditText shaba=new EditText(this);shaba.setHint("شماره شبا");shaba.setText(old.optString("shaba",""));
                  EditText exp=new EditText(this);exp.setHint("تاریخ انقضا");exp.setText(old.optString("expiry",""));
                  box.addView(bank);box.addView(name);box.addView(number);box.addView(shaba);box.addView(exp);
                  AlertDialog d=new AlertDialog.Builder(this).setTitle(editing?"ویرایش کارت":"افزودن کارت").setView(box)
                      .setNegativeButton("لغو",null).setPositiveButton("ذخیره",null).create();
                  d.setOnShowListener(x->d.getButton(-1).setOnClickListener(v->{
                      try{JSONObject c=new JSONObject();c.put("bank",bank.getText().toString().trim());c.put("name",name.getText().toString().trim());
                          c.put("number",number.getText().toString().trim());c.put("shaba",shaba.getText().toString().trim());c.put("expiry",exp.getText().toString().trim());
                          if(editing)cards.put(ix,c);else cards.put(c);save();refresh();d.dismiss();}catch(Exception ignored){}
                  }));d.show();
              }
          }
          JAVA
          cat > app/src/main/java/com/example/bankcards/PinActivity.java <<'JAVA'
          package com.example.bankcards;
          import android.app.*;import android.os.*;import android.content.*;import android.content.pm.PackageManager;import android.graphics.*;
          import android.view.*;import android.widget.*;import java.nio.charset.StandardCharsets;import java.security.*;import android.util.Base64;
          public class PinActivity extends Activity {
              SharedPreferences p; EditText pin;
              public void onCreate(Bundle b){super.onCreate(b);p=getSharedPreferences("cards",0);if(!p.getBoolean("setup",false)){setup();}else login();}
              TextView tv(String s,float z){TextView v=new TextView(this);v.setText(s);v.setTextSize(z);v.setGravity(17);v.setPadding(10,10,10,10);return v;}
              void setup(){
                  LinearLayout r=new LinearLayout(this);r.setOrientation(LinearLayout.VERTICAL);r.setGravity(17);r.setPadding(35,35,35,35);
                  r.addView(tv("🔐 کارت‌های بانکی",26));r.addView(tv("یک PIN حداقل ۴ رقمی تعیین کنید",17));
                  EditText e=new EditText(this);e.setHint("PIN");e.setInputType(2|16);e.setGravity(17);r.addView(e);
                  Button b=new Button(this);b.setText("ذخیره PIN");r.addView(b);setContentView(r);
                  b.setOnClickListener(v->{String s=e.getText().toString();if(s.length()<4){e.setError("حداقل ۴ رقم");return;}p.edit().putString("pin",hash(s)).putBoolean("setup",true).apply();open();});
              }
              void login(){
                  LinearLayout r=new LinearLayout(this);r.setOrientation(LinearLayout.VERTICAL);r.setGravity(17);r.setPadding(35,35,35,35);
                  r.addView(tv("🔐 کارت‌های بانکی",26));r.addView(tv("PIN را وارد کنید",17));
                  pin=new EditText(this);pin.setHint("PIN");pin.setInputType(2|16);pin.setGravity(17);r.addView(pin);
                  Button b=new Button(this);b.setText("ورود با PIN");r.addView(b);
                  b.setOnClickListener(v->{if(p.getString("pin","").equals(hash(pin.getText().toString())))open();else pin.setError("PIN اشتباه است");});
                  if(Build.VERSION.SDK_INT>=23&&getPackageManager().hasSystemFeature(PackageManager.FEATURE_FINGERPRINT)){
                      Button f=new Button(this);f.setText("👆 ورود با اثر انگشت");r.addView(f);f.setOnClickListener(v->fingerprint());
                  }
                  setContentView(r);
              }
              void open(){startActivity(new Intent(this,MainActivity.class));finish();}
              void fingerprint(){
                  android.hardware.fingerprint.FingerprintManager fm=(android.hardware.fingerprint.FingerprintManager)getSystemService(FINGERPRINT_SERVICE);
                  if(!fm.isHardwareDetected()||!fm.hasEnrolledFingerprints()){Toast.makeText(this,"اثر انگشت تنظیم نشده است",Toast.LENGTH_SHORT).show();return;}
                  fm.authenticate(null,null,0,new android.hardware.fingerprint.FingerprintManager.AuthenticationCallback(){
                      public void onAuthenticationSucceeded(android.hardware.fingerprint.FingerprintManager.AuthenticationResult r){runOnUiThread(()->open());}
                      public void onAuthenticationError(int c,CharSequence s){runOnUiThread(()->Toast.makeText(PinActivity.this,s,Toast.LENGTH_SHORT).show());}
                  },null);
              }
              String hash(String s){try{MessageDigest m=MessageDigest.getInstance("SHA-256");return Base64.encodeToString(m.digest(s.getBytes(StandardCharsets.UTF_8)),Base64.NO_WRAP);}catch(Exception e){return s;}}
          }
          JAVA
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle assembleDebug --no-daemon -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BankCards-APK-V1
          path: app/build/outputs/apk/debug/app-debug.apk
